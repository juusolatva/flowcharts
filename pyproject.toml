[project]
name = "flowcharts"
version = "0.1.0"
description = "Generate control-flow flowcharts and call graphs (JSON, DOT, SVG, PNG, Mermaid) from Python code, and browse them in a local web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "graphviz>=0.21",
    "tree-sitter>=0.25.2,!=0.26.0",
    "tree-sitter-python>=0.25",
]

[project.scripts]
pyflowcharts = "pyflowcharts.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflowcharts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "tests/fixtures"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true
