[project]
name = "python-flowcharts"
version = "0.1.0"
description = "Generate control-flow flowcharts (JSON, DOT, SVG, PNG, Mermaid) from Python functions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["graphviz>=0.21"]

[project.scripts]
pyflowcharts = "pyflowcharts.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyflowcharts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]
