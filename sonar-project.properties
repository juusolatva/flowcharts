sonar.organization=juusolatva
sonar.projectKey=juusolatva_flowcharts

sonar.sources=src,desktop/src,.github
sonar.tests=tests,desktop/tests
sonar.cfamily.reportingCppStandardOverride=c++17
sonar.coverageReportPaths=native-coverage.xml

sonar.python.version=3.12, 3.13, 3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info
sonar.coverage.exclusions=src/pyflowcharts/explorer/static/views/**,tests/**,desktop/tests/**

# Qt Test slots are conventionally non-const, and cpp:S5817 flags every one of them. Sonar can
# only exclude by path, so this turns the rule off for all of desktop/tests/; it still applies
# to desktop/src/.
sonar.issue.ignore.multicriteria=qtTestSlots
sonar.issue.ignore.multicriteria.qtTestSlots.ruleKey=cpp:S5817
sonar.issue.ignore.multicriteria.qtTestSlots.resourceKey=desktop/tests/**
