name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true

      # Locked wheels only: no build scripts run, and the project itself is not built
      # (pytest finds it through `pythonpath` in pyproject.toml).
      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project

      - name: Lint
        run: ruff check --output-format=github

      - name: Check formatting
        run: ruff format --check --diff

  typecheck:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true

      # Same locked install as the lint job; pyright finds src/ and tests/ through
      # `extraPaths` in pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project

      # The PyPI wrapper fetches the npm package of the pinned version on first run.
      - name: Type check
        run: pyright

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SVG/PNG tests need the dot binary; they are skipped without it.
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true

      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project

      - name: Run tests with coverage
        run: pytest -rs --cov --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  native-coverage:
    name: Native coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: '3.13'
          activate-environment: true

      - name: Install locked coverage tools and Qt
        run: |
          uv sync --locked --no-build --no-install-project \
            --group native-coverage
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev graphviz

      - name: Build instrumented native GUI
        run: |
          cmake -S desktop -B build/coverage -DCMAKE_BUILD_TYPE=Debug \
            -DFLOWCHARTS_COVERAGE=ON
          cmake --build build/coverage --parallel 2

      - name: Run native suites and collect coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          ctest --test-dir build/coverage --output-on-failure
          gcovr --root . --filter 'desktop/src/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --sonarqube native-coverage.xml --txt native-coverage.txt \
            build/coverage

      - name: Upload native coverage
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-coverage
          path: |
            native-coverage.xml
            native-coverage.txt
          retention-days: 7

  js-test:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Node's built-in runner: no npm packages. The lcov report feeds SonarQube.
      - name: Run tests with coverage
        run: >
          node --test --experimental-test-coverage
          --test-coverage-include='src/**/*.mjs'
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=lcov --test-reporter-destination=lcov.info
          'tests/js/*.test.mjs'

      - name: Upload coverage report
        # v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: js-coverage
          path: lcov.info
          retention-days: 7

  sonarqube:
    name: SonarQube Cloud
    needs: [test, js-test, native-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `if:` can't read secrets, so the scan step checks this env var instead. It is empty on
    # fork PRs (no secrets) and wherever the secret is missing.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Report missing token
        if: env.SONAR_TOKEN == ''
        run: echo "::warning::SONAR_TOKEN is not available to this run (fork PR or unset secret); skipping the SonarQube scan."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage

      - name: Download JavaScript coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-coverage

      - name: Download native coverage report
        # v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
